<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spot the Scam — Atur Ulang Kata Sandi</title>
    <meta name="description" content="Minta tautan reset kata sandi atau atur kata sandi baru untuk akun Spot the Scam." />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #e6e9fb; --card: #fff; --ink: #2b3a95; --text: #3a4270;
        --muted: #7a82a8; --accent: #4a63e7; --field: #f1f3fd; --line: #d3d9f5; --err: #c2294a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1022; --card: #161a33; --ink: #c3ccff; --text: #b4bce6;
          --muted: #8890bd; --accent: #7f8fff; --field: #1e2342; --line: #2c3260; --err: #ff7b98;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg); color: var(--text);
        font: 400 15px/1.6 Manrope, system-ui, sans-serif;
        min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
        padding: max(24px, env(safe-area-inset-top, 0px)) 18px max(24px, env(safe-area-inset-bottom, 0px));
      }
      .card {
        margin: auto; /* tetap di tengah, tak terpotong bila kartu lebih tinggi dari layar */
        background: var(--card); border: 1px solid var(--line); border-radius: 20px;
        box-shadow: 0 24px 60px rgba(43, 58, 149, 0.12);
        padding: 32px 28px; width: 100%; max-width: 420px;
      }
      h1 { font: 700 26px/1.25 Merriweather, Georgia, serif; color: var(--ink); margin: 0 0 8px; }
      .sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
      label { display: block; font-weight: 600; font-size: 13px; color: var(--ink); margin: 0 0 6px; }
      input {
        width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
        background: var(--field); color: var(--text); font: inherit;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      .field { margin-bottom: 14px; }
      .field .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
      button {
        width: 100%; padding: 13px 16px; border: 0; border-radius: 12px; cursor: pointer;
        background: var(--accent); color: #fff; font: 700 15px Manrope, sans-serif;
        transition: filter .15s ease;
      }
      button:hover:not(:disabled) { filter: brightness(1.06); }
      button:disabled { opacity: .6; cursor: default; }
      .msg { min-height: 22px; margin: 14px 0 0; font-size: 13.5px; }
      .msg.err { color: var(--err); }
      .msg.ok { color: #1f8a5f; }
      @media (prefers-color-scheme: dark) { .msg.ok { color: #57d9a3; } }
      .back { display: block; text-align: center; margin-top: 18px; font-size: 13.5px; color: var(--accent); text-decoration: none; }
      .back:hover { text-decoration: underline; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="title">Lupa Kata Sandi?</h1>
      <p class="sub" id="sub">Masukkan email akunmu, kami kirim tautan untuk membuat kata sandi baru.</p>

      <form id="f-req" novalidate>
        <div class="field">
          <label for="em">Email</label>
          <input id="em" type="email" autocomplete="email" placeholder="nama@email.com" />
        </div>
        <button type="submit" id="btn-req">Kirim Tautan Reset</button>
        <p class="msg" id="msg-req" role="status" aria-live="polite"></p>
      </form>

      <form id="f-set" class="hidden" novalidate>
        <div class="field">
          <label for="pw1">Kata sandi baru</label>
          <input id="pw1" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter" />
        </div>
        <div class="field">
          <label for="pw2">Ulangi kata sandi baru</label>
          <input id="pw2" type="password" autocomplete="new-password" placeholder="Ketik ulang" />
          <div class="hint">Setelah disimpan, kamu akan diminta masuk lagi memakai kata sandi baru.</div>
        </div>
        <button type="submit" id="btn-set">Simpan Kata Sandi Baru</button>
        <p class="msg" id="msg-set" role="status" aria-live="polite"></p>
      </form>

      <a class="back" href="login.html">← Kembali ke halaman masuk</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (function () {
        // Baca hash SEBELUM client Supabase memproses & membersihkannya.
        var hash = window.location.hash || "";
        var hashParams = new URLSearchParams(hash.replace(/^#/, ""));
        var linkError = hashParams.get("error_description");
        var isRecoveryLink = hashParams.get("type") === "recovery" || /type=recovery/.test(window.location.search);

        var SUPABASE_URL = "https://aadgytxzojdniewtnurk.supabase.co";
        var SUPABASE_ANON_KEY = "eyJhbG...wW_U";
        var client = null;
        try {
          if (window.supabase && window.supabase.createClient) {
            client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          }
        } catch (e) {
          console.error("Gagal init Supabase client:", e);
        }

        var title = document.getElementById("title");
        var sub = document.getElementById("sub");
        var fReq = document.getElementById("f-req");
        var fSet = document.getElementById("f-set");
        var msgReq = document.getElementById("msg-req");
        var msgSet = document.getElementById("msg-set");
        var btnReq = document.getElementById("btn-req");
        var btnSet = document.getElementById("btn-set");

        function showSetMode() {
          title.textContent = "Buat Kata Sandi Baru";
          sub.textContent = "Tautan reset valid. Masukkan kata sandi baru untuk akunmu.";
          fReq.classList.add("hidden");
          fSet.classList.remove("hidden");
          document.getElementById("pw1").focus();
        }

        function fail(text) {
          msgReq.className = "msg err";
          msgReq.textContent = text;
          btnReq.disabled = false;
        }

        if (linkError) {
          fail("Tautan tidak valid atau sudah kedaluwarsa (" + linkError + "). Minta tautan baru di bawah.");
        } else if (isRecoveryLink) {
          showSetMode();
        }

        if (client) {
          client.auth.onAuthStateChange(function (event) {
            if (event === "PASSWORD_RECOVERY") showSetMode();
          });
        }

        fReq.addEventListener("submit", async function (e) {
          e.preventDefault();
          var em = document.getElementById("em").value.trim();
          if (!/^\S+@\S+\.\S+$/.test(em)) {
            msgReq.className = "msg err";
            msgReq.textContent = "Email belum valid. Contoh: nama@email.com";
            return;
          }
          if (!client) {
            msgReq.className = "msg err";
            msgReq.textContent = "Layanan autentikasi tidak termuat. Coba muat ulang halaman.";
            return;
          }
          btnReq.disabled = true;
          msgReq.className = "msg";
          msgReq.textContent = "Mengirim tautan...";
          try {
            var redirectTo = window.location.origin + window.location.pathname;
            var res = await client.auth.resetPasswordForEmail(em, { redirectTo: redirectTo });
            if (res.error) throw res.error;
            msgReq.className = "msg ok";
            msgReq.textContent = "Tautan reset terkirim ke " + em + ". Cek inbox dan folder spam, lalu buka tautannya.";
          } catch (err) {
            msgReq.className = "msg err";
            msgReq.textContent = /rate limit|too many/i.test(err.message)
              ? "Terlalu banyak permintaan. Tunggu beberapa menit lalu coba lagi."
              : "Gagal mengirim tautan: " + err.message;
          }
          btnReq.disabled = false;
        });

        fSet.addEventListener("submit", async function (e) {
          e.preventDefault();
          var p1 = document.getElementById("pw1").value;
          var p2 = document.getElementById("pw2").value;
          if (p1.length < 6) {
            msgSet.className = "msg err";
            msgSet.textContent = "Kata sandi minimal 6 karakter.";
            return;
          }
          if (p1 !== p2) {
            msgSet.className = "msg err";
            msgSet.textContent = "Kedua kata sandi belum sama.";
            return;
          }
          if (!client) {
            msgSet.className = "msg err";
            msgSet.textContent = "Layanan autentikasi tidak termuat. Coba muat ulang halaman.";
            return;
          }
          btnSet.disabled = true;
          msgSet.className = "msg";
          msgSet.textContent = "Menyimpan...";
          try {
            var res = await client.auth.updateUser({ password: p1 });
            if (res.error) throw res.error;
            await client.auth.signOut();
            msgSet.className = "msg ok";
            msgSet.textContent = "Kata sandi berhasil diubah. Mengalihkan ke halaman masuk...";
            setTimeout(function () { window.location.href = "login.html"; }, 1600);
          } catch (err) {
            msgSet.className = "msg err";
            msgSet.textContent = /expired|invalid|session/i.test(err.message)
              ? "Sesi reset sudah kedaluwarsa. Minta tautan baru."
              : "Gagal menyimpan: " + err.message;
            btnSet.disabled = false;
            if (/expired|invalid|session/i.test(err.message)) {
              fSet.classList.add("hidden");
              fReq.classList.remove("hidden");
              title.textContent = "Lupa Kata Sandi?";
              sub.textContent = "Masukkan email akunmu, kami kirim tautan untuk membuat kata sandi baru.";
            }
          }
        });
      })();
    </script>
  </body>
</html>
