<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Pemeriksaan — Spot the Scam</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        },
        theme: {
          extend: {
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --red: #d02a0a;
        --red-txt: #b3261e;
        --yellow-txt: #8a5a00;
        --red2: #701507;
        --red3: #531002;
        --wine: #5a0f14;
        --lime: #c6f52c;
        --ok: #1f9d57;
        --warn: #f2b400;
        --bg: #f6f5f0;
        --ink: #1a1a1a;
        --card: #fff;
        --mut: #6b675e;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #151311;
          --ink: #f6f5f0;
          --card: #211e1b;
          --mut: #a39e92;
          --red-txt: #ff9a80;
          --yellow-txt: #ffd166;
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --bg: #151311;
        --ink: #f6f5f0;
        --card: #211e1b;
        --mut: #a39e92;
        --red-txt: #ff9a80;
        --yellow-txt: #ffd166;
        color-scheme: dark;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .card {
        background-color: var(--card) !important;
        color: var(--ink) !important;
        border: 1px solid rgba(107, 103, 94, 0.15);
      }

      .table {
        color: var(--ink) !important;
        background-color: transparent !important;
        --bs-table-bg: transparent;
        --bs-table-color: var(--ink);
        --bs-table-hover-bg: transparent;
      }

      /* Sel tabel ikut tema: tanpa ini sel tetap putih walau tema gelap */
      .table > :not(caption) > * > * {
        background-color: transparent !important;
        color: inherit;
      }

      .table .text-muted {
        color: var(--mut) !important;
      }

      .table thead th {
        background-color: rgba(107, 103, 94, 0.08) !important;
        color: var(--mut) !important;
        border-bottom: 1px solid rgba(107, 103, 94, 0.15) !important;
      }

      .table tbody tr {
        border-color: rgba(107, 103, 94, 0.1) !important;
        transition: background-color 0.2s ease;
      }

      .table tbody tr:hover {
        background-color: rgba(107, 103, 94, 0.04);
      }

      .text-muted {
        color: var(--mut) !important;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 14px;
      }

      .back-link:hover {
        color: var(--red);
      }

      .status-fix {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        border: 1px solid rgba(107, 103, 94, 0.25);
        color: var(--mut);
        background-color: rgba(107, 103, 94, 0.1);
        white-space: nowrap;
      }

      .status-fix.reported {
        color: var(--red-txt);
        background-color: rgba(208, 42, 10, 0.14);
        border-color: rgba(208, 42, 10, 0.35);
      }

      .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .more-btn {
        border: 0;
        background: transparent;
        padding: 0;
        margin-left: 4px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--red-txt);
        text-decoration: underline;
        cursor: pointer;
        white-space: nowrap;
      }

      .msg-text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .lvl-dot {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .lvl-red {
        background-color: rgba(208, 42, 10, 0.15);
        color: var(--red-txt);
      }

      .lvl-yellow {
        background-color: rgba(242, 180, 0, 0.18);
        color: var(--yellow-txt);
      }

      .lvl-green {
        background-color: rgba(31, 157, 87, 0.15);
        color: var(--ok);
      }
    </style>
  </head>
  <body
    class="min-h-screen p-3 sm:p-6 lg:p-8 d-flex flex-column justify-between"
  >
    <div class="max-w-7xl mx-auto w-full flex-grow">
      <a class="back-link" href="home.html"
        ><i class="fa-solid fa-arrow-left"></i> Kembali ke beranda</a
      >
      <h1 class="h4 fw-bold mb-1">Riwayat Pemeriksaan</h1>
      <p class="text-muted small mb-4">
        Semua pesan, tautan, dan nomor yang pernah kamu cek. Status di kolom
        kanan bisa kamu ubah, dan nomor yang kamu laporkan otomatis tampil
        sebagai "Dilaporkan".
      </p>

      <div class="card border-0 rounded-4 shadow-sm overflow-hidden">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead
              class="text-uppercase fw-bold"
              style="font-size: 0.75rem; letter-spacing: 0.05em"
            >
              <tr>
                <th class="py-3 px-4" style="width: 33%">Riwayat Pencarian</th>
                <th class="py-3 px-4" style="width: 42%">Isi Pesan</th>
                <th class="py-3 px-4" style="width: 25%">Status</th>
              </tr>
            </thead>
            <tbody class="border-top-0" id="rows">
              <tr>
                <td class="py-5 px-4 text-muted" colspan="3">Memuat riwayat…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const SUPABASE_URL = "https://aadgytxzojdniewtnurk.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZGd5dHh6b2pkbmlld3RudXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNjU5NDgsImV4cCI6MjEwOTc0MTk0OH0.eK_ZNRU3_DisdsBG_4l3L43ZXeiZy8H1UhSaeywwW_U";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      const ST = {
        reported: {
          label: "Dilaporkan",
          icon: '<i class="fa-solid fa-triangle-exclamation"></i>',
        },
        none: {
          label: "Belum dilaporkan",
          icon: '<i class="fa-solid fa-circle-info"></i>',
        },
        nophone: {
          label: "Tanpa nomor",
          icon: '<i class="fa-solid fa-minus"></i>',
        },
      };

      const LVL = {
        red: {
          cls: "lvl-red",
          label: "BAHAYA",
          icon: "fa-triangle-exclamation",
        },
        yellow: {
          cls: "lvl-yellow",
          label: "WASPADA",
          icon: "fa-circle-exclamation",
        },
        green: {
          cls: "lvl-green",
          label: "TANPA INDIKASI",
          icon: "fa-shield-halved",
        },
      };

      function timeAgo(iso) {
        const t = new Date(iso).getTime();
        if (!t) return "";
        const m = Math.floor((Date.now() - t) / 60000);
        if (m < 1) return "baru saja";
        if (m < 60) return m + " menit lalu";
        const h = Math.floor(m / 60);
        if (h < 24) return h + " jam lalu";
        const day = Math.floor(h / 24);
        if (day === 1) return "kemarin";
        if (day < 30) return day + " hari lalu";
        return new Date(iso).toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      // Nomor HP dinormalisasi sama seperti di home.html
      function phonesOf(text) {
        return [
          ...new Set(
            (text.match(/(\+62|62|0)8[\d\s-]{8,14}/g) || []).map((p) =>
              p.replace(/[\s-]/g, "").replace(/^(\+62|62)/, "0"),
            ),
          ),
        ];
      }

      function rowHTML(h) {
        const lvl = LVL[h.level] || LVL.green;
        const key = ST[h.status] ? h.status : "none";
        const st = ST[key];
        const text = h.message || "";
        const title = text.split("\n")[0].slice(0, 60) || "(tanpa teks)";
        const short = text.length > 110 ? text.slice(0, 110) + "…" : text;
        const more =
          text.length > 110
            ? `<button type="button" class="more-btn" onclick="toggleMessage('${h.id}')">lihat selanjutnya</button>`
            : "";
        return `
          <tr class="transition border-bottom">
            <td class="py-4 px-4">
              <div class="d-flex align-items-center gap-3">
                <div class="lvl-dot ${lvl.cls}" title="Skor risiko ${h.score}/100">
                  <i class="fa-solid ${lvl.icon}"></i>
                </div>
                <div>
                  <div class="fw-bold">${esc(title)}</div>
                  <div class="text-muted small">${timeAgo(h.created_at)} · ${lvl.label} ${h.score}/100</div>
                </div>
              </div>
            </td>
            <td class="py-4 px-4">
              <div class="message-container" id="msg-${h.id}">
                <span class="short-text text-muted msg-text">${esc(short)}</span>
                <span class="full-text d-none text-muted msg-text">${esc(text)}</span>${more}
              </div>
            </td>
            <td class="py-4 px-4">
              <span class="status-fix ${key === "reported" ? "reported" : ""}">${st.icon} ${st.label}</span>
            </td>
          </tr>`;
      }

      async function init() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (!session) {
          location.replace("login.html");
          return;
        }
        let { data, error } = await supabaseClient
          .from("analysis_history")
          .select("id, message, score, level, status, created_at")
          .eq("user_id", session.user.id)
          .order("created_at", { ascending: false })
          .limit(100);

        // DB lama belum punya kolom status (setup.sql belum dijalankan ulang):
        // migrasi status tidak dipakai lagi: status dihitung dari nomor terlapor.
        if (error && error.code === "42703") {
          ({ data, error } = await supabaseClient
            .from("analysis_history")
            .select("id, message, score, level, created_at")
            .eq("user_id", session.user.id)
            .order("created_at", { ascending: false })
            .limit(100));
          data = (data || []).map((h) => ({ ...h, status: "unreviewed" }));
        }

        if (error || !data) {
          console.warn("Gagal muat riwayat:", error);
          $("#rows").innerHTML = `<tr><td class="py-5 px-4 text-muted" colspan="3">Riwayat tidak bisa dimuat. Muat ulang halaman atau login kembali.</td></tr>`;
          return;
        }
        // Status mengikuti daftar nomor terlapor lintas pengguna, bukan pilihan manual
        const allPhones = [...new Set(data.flatMap((h) => phonesOf(h.message || "")))];
        let reported = {};
        if (allPhones.length) {
          const { data: rn, error: rnErr } = await supabaseClient
            .from("reported_numbers")
            .select("phone")
            .in("phone", allPhones);
          if (rnErr) console.warn("Gagal muat nomor terlapor:", rnErr.message);
          reported = Object.fromEntries((rn || []).map((r) => [r.phone, true]));
        }
        data = data.map((h) => {
          const ph = phonesOf(h.message || "");
          return {
            ...h,
            status: !ph.length
              ? "nophone"
              : ph.some((p) => reported[p])
                ? "reported"
                : "none",
          };
        });

        $("#rows").innerHTML = data.length
          ? data.map(rowHTML).join("")
          : `<tr><td class="py-5 px-4 text-muted" colspan="3">Belum ada riwayat. <a href="home.html#cek">Cek pesan pertamamu</a>.</td></tr>`;
      }

      // Teks perluas / ringkas
      function toggleMessage(id) {
        const box = document.getElementById(`msg-${id}`);
        const shortText = box.querySelector(".short-text");
        const fullText = box.querySelector(".full-text");
        const btn = box.querySelector(".more-btn");
        const open = fullText.classList.contains("d-none");

        shortText.classList.toggle("d-none", open);
        fullText.classList.toggle("d-none", !open);
        if (btn) btn.textContent = open ? "tutup" : "lihat selanjutnya";
      }

      document.documentElement.style.visibility = "hidden";
      init().finally(() => {
        document.documentElement.style.visibility = "";
      });
    </script>
  </body>
</html>
