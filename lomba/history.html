<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Pemeriksaan — Spot the Scam</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        },
        theme: {
          extend: {
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --red: #d02a0a;
        --red-txt: #b3261e;
        --yellow-txt: #8a5a00;
        --red2: #701507;
        --red3: #531002;
        --wine: #5a0f14;
        --lime: #c6f52c;
        --ok: #1f9d57;
        --warn: #f2b400;
        --bg: #f6f5f0;
        --ink: #1a1a1a;
        --card: #fff;
        --mut: #6b675e;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #151311;
          --ink: #f6f5f0;
          --card: #211e1b;
          --mut: #a39e92;
          --red-txt: #ff9a80;
          --yellow-txt: #ffd166;
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --bg: #151311;
        --ink: #f6f5f0;
        --card: #211e1b;
        --mut: #a39e92;
        --red-txt: #ff9a80;
        --yellow-txt: #ffd166;
        color-scheme: dark;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .card {
        background-color: var(--card) !important;
        color: var(--ink) !important;
        border: 1px solid rgba(107, 103, 94, 0.15);
      }

      .table {
        color: var(--ink) !important;
        background-color: transparent !important;
      }

      .table thead th {
        background-color: rgba(107, 103, 94, 0.08) !important;
        color: var(--mut) !important;
        border-bottom: 1px solid rgba(107, 103, 94, 0.15) !important;
      }

      .table tbody tr {
        border-color: rgba(107, 103, 94, 0.1) !important;
        transition: background-color 0.2s ease;
      }

      .table tbody tr:hover {
        background-color: rgba(107, 103, 94, 0.04);
      }

      .text-muted {
        color: var(--mut) !important;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 14px;
      }

      .back-link:hover {
        color: var(--red);
      }

      .status-dropdown-wrapper {
        position: relative;
        display: inline-block;
      }

      .status-toggle-btn {
        background-color: rgba(107, 103, 94, 0.12);
        border: 1px solid rgba(107, 103, 94, 0.2);
        color: var(--ink);
        border-radius: 9999px;
        padding: 8px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 170px;
      }

      .status-toggle-btn.btn-reported {
        background-color: rgba(208, 42, 10, 0.12);
        color: var(--red-txt);
        border-color: rgba(208, 42, 10, 0.3);
      }

      .status-toggle-btn:hover {
        filter: brightness(0.95);
      }

      .status-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        width: 170px;
        background-color: var(--card);
        border-radius: 1rem;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.15),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        z-index: 50;
        display: none;
        border: 1px solid rgba(107, 103, 94, 0.2);
        padding: 6px;
        animation: fadeInDropdown 0.2s ease-out forwards;
      }

      @keyframes fadeInDropdown {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .status-menu.show {
        display: block;
      }

      .status-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border-radius: 0.75rem;
        border: none;
        background: transparent;
        color: var(--ink);
        font-size: 0.875rem;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }

      .status-option.reported:hover,
      .status-option.reported.active {
        background-color: rgba(208, 42, 10, 0.15);
        color: var(--red-txt);
      }

      .status-option.unreviewed:hover,
      .status-option.unreviewed.active {
        background-color: rgba(107, 103, 94, 0.15);
        color: var(--ink);
      }

      .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .more-btn {
        border: 0;
        background: transparent;
        padding: 0;
        margin-left: 4px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--red-txt);
        text-decoration: underline;
        cursor: pointer;
        white-space: nowrap;
      }

      .msg-text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .lvl-dot {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .lvl-red {
        background-color: rgba(208, 42, 10, 0.15);
        color: var(--red-txt);
      }

      .lvl-yellow {
        background-color: rgba(242, 180, 0, 0.18);
        color: var(--yellow-txt);
      }

      .lvl-green {
        background-color: rgba(31, 157, 87, 0.15);
        color: var(--ok);
      }
    </style>
  </head>
  <body
    class="min-h-screen p-3 sm:p-6 lg:p-8 d-flex flex-column justify-between"
  >
    <div class="max-w-7xl mx-auto w-full flex-grow">
      <a class="back-link" href="home.html"
        ><i class="fa-solid fa-arrow-left"></i> Kembali ke beranda</a
      >
      <h1 class="h4 fw-bold mb-1">Riwayat Pemeriksaan</h1>
      <p class="text-muted small mb-4">
        Semua pesan, tautan, dan nomor yang pernah kamu cek. Status di kolom
        kanan bisa kamu ubah, dan nomor yang kamu laporkan otomatis tampil
        sebagai "Dilaporkan".
      </p>

      <div class="card border-0 rounded-4 shadow-sm overflow-hidden">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead
              class="text-uppercase fw-bold"
              style="font-size: 0.75rem; letter-spacing: 0.05em"
            >
              <tr>
                <th class="py-3 px-4" style="width: 33%">Riwayat Pencarian</th>
                <th class="py-3 px-4" style="width: 42%">Isi Pesan</th>
                <th class="py-3 px-4" style="width: 25%">Status</th>
              </tr>
            </thead>
            <tbody class="border-top-0" id="rows">
              <tr>
                <td class="py-5 px-4 text-muted" colspan="3">Memuat riwayat…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const SUPABASE_URL = "https://aadgytxzojdniewtnurk.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZGd5dHh6b2pkbmlld3RudXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNjU5NDgsImV4cCI6MjEwOTc0MTk0OH0.eK_ZNRU3_DisdsBG_4l3L43ZXeiZy8H1UhSaeywwW_U";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      const ST = {
        reported: {
          label: "Dilaporkan",
          icon: '<i class="fa-solid fa-triangle-exclamation"></i>',
          btn: "btn-reported",
          cls: "reported",
        },
        unreviewed: {
          label: "Tidak Ditinjau",
          icon: '<i class="fa-solid fa-circle-info"></i>',
          btn: "",
          cls: "unreviewed",
        },
      };
      const LVL = {
        red: {
          cls: "lvl-red",
          label: "BAHAYA",
          icon: "fa-triangle-exclamation",
        },
        yellow: {
          cls: "lvl-yellow",
          label: "WASPADA",
          icon: "fa-circle-exclamation",
        },
        green: { cls: "lvl-green", label: "AMAN", icon: "fa-shield-halved" },
      };

      function timeAgo(iso) {
        const t = new Date(iso).getTime();
        if (!t) return "";
        const m = Math.floor((Date.now() - t) / 60000);
        if (m < 1) return "baru saja";
        if (m < 60) return m + " menit lalu";
        const h = Math.floor(m / 60);
        if (h < 24) return h + " jam lalu";
        const day = Math.floor(h / 24);
        if (day === 1) return "kemarin";
        if (day < 30) return day + " hari lalu";
        return new Date(iso).toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function rowHTML(h) {
        const lvl = LVL[h.level] || LVL.green;
        const key = ST[h.status] ? h.status : "unreviewed";
        const st = ST[key];
        const text = h.message || "";
        const title = text.split("\n")[0].slice(0, 60) || "(tanpa teks)";
        const short = text.length > 110 ? text.slice(0, 110) + "…" : text;
        const more =
          text.length > 110
            ? `<button type="button" class="more-btn" onclick="toggleMessage('${h.id}')">lihat selanjutnya</button>`
            : "";
        const opts = Object.keys(ST)
          .map(
            (k) =>
              `<button type="button" class="status-option ${ST[k].cls} ${
                k === key ? "active" : ""
              }" data-status="${k}" onclick="selectStatus('${h.id}','${k}')">${
                ST[k].icon
              } ${ST[k].label}</button>`,
          )
          .join("");

        return `
          <tr class="transition border-bottom">
            <td class="py-4 px-4">
              <div class="d-flex align-items-center gap-3">
                <div class="lvl-dot ${lvl.cls}" title="Skor risiko ${h.score}/100">
                  <i class="fa-solid ${lvl.icon}"></i>
                </div>
                <div>
                  <div class="fw-bold">${esc(title)}</div>
                  <div class="text-muted small">${timeAgo(h.created_at)} · ${lvl.label} ${h.score}/100</div>
                </div>
              </div>
            </td>
            <td class="py-4 px-4">
              <div class="message-container" id="msg-${h.id}">
                <span class="short-text text-muted msg-text">${esc(short)}</span>
                <span class="full-text d-none text-muted msg-text">${esc(text)}</span>${more}
              </div>
            </td>
            <td class="py-4 px-4">
              <div class="status-dropdown-wrapper">
                <button type="button" class="status-toggle-btn ${st.btn}" onclick="toggleDropdown(event,'dropdown-${h.id}')">
                  <span class="selected-text d-flex align-items-center gap-2">${st.icon} ${st.label}</span>
                  <i class="fa-solid fa-chevron-down small text-muted"></i>
                </button>
                <div class="status-menu" id="dropdown-${h.id}">${opts}</div>
              </div>
            </td>
          </tr>`;
      }

      async function init() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (!session) {
          location.replace("login.html");
          return;
        }
        let { data, error } = await supabaseClient
          .from("analysis_history")
          .select("id, message, score, level, status, created_at")
          .eq("user_id", session.user.id)
          .order("created_at", { ascending: false })
          .limit(100);

        // DB lama belum punya kolom status (setup.sql belum dijalankan ulang):
        // tetap tampilkan riwayat tanpa dropdown status.
        if (error && error.code === "42703") {
          ({ data, error } = await supabaseClient
            .from("analysis_history")
            .select("id, message, score, level, created_at")
            .eq("user_id", session.user.id)
            .order("created_at", { ascending: false })
            .limit(100));
          data = (data || []).map((h) => ({ ...h, status: "unreviewed" }));
        }

        if (error || !data) {
          console.warn("Gagal muat riwayat:", error);
          $("#rows").innerHTML = `<tr><td class="py-5 px-4 text-muted" colspan="3">Riwayat tidak bisa dimuat. Muat ulang halaman atau login kembali.</td></tr>`;
          return;
        }
        $("#rows").innerHTML = data.length
          ? data.map(rowHTML).join("")
          : `<tr><td class="py-5 px-4 text-muted" colspan="3">Belum ada riwayat. <a href="home.html#cek">Cek pesan pertamamu</a>.</td></tr>`;
      }

      // Buka / tutup dropdown status
      function toggleDropdown(event, dropdownId) {
        event.stopPropagation();
        document.querySelectorAll(".status-menu").forEach((menu) => {
          if (menu.id !== dropdownId) menu.classList.remove("show");
        });
        document.getElementById(dropdownId).classList.toggle("show");
      }

      // Pilih status, lalu simpan ke Supabase
      async function selectStatus(id, key) {
        const st = ST[key] || ST.unreviewed;
        const wrapper = document
          .getElementById(`dropdown-${id}`)
          .closest(".status-dropdown-wrapper");
        const btn = wrapper.querySelector(".status-toggle-btn");
        const menu = wrapper.querySelector(".status-menu");
        const prev = btn.innerHTML;

        btn.querySelector(".selected-text").innerHTML = st.icon + " " + st.label;
        btn.className = "status-toggle-btn" + (st.btn ? " " + st.btn : "");
        menu.querySelectorAll(".status-option").forEach((opt) => {
          opt.classList.toggle("active", opt.dataset.status === key);
        });
        menu.classList.remove("show");

        const { error } = await supabaseClient
          .from("analysis_history")
          .update({ status: key })
          .eq("id", id);
        if (error) {
          console.warn("Gagal simpan status:", error);
          btn.innerHTML = prev;
          alert("Status gagal disimpan. Coba lagi.");
        }
      }

      // Tutup dropdown saat klik di luar
      window.addEventListener("click", () => {
        document.querySelectorAll(".status-menu").forEach((menu) => {
          menu.classList.remove("show");
        });
      });

      // Teks perluas / ringkas
      function toggleMessage(id) {
        const box = document.getElementById(`msg-${id}`);
        const shortText = box.querySelector(".short-text");
        const fullText = box.querySelector(".full-text");
        const btn = box.querySelector(".more-btn");
        const open = fullText.classList.contains("d-none");

        shortText.classList.toggle("d-none", open);
        fullText.classList.toggle("d-none", !open);
        if (btn) btn.textContent = open ? "tutup" : "lihat selanjutnya";
      }

      document.documentElement.style.visibility = "hidden";
      init().finally(() => {
        document.documentElement.style.visibility = "";
      });
    </script>
  </body>
</html>
